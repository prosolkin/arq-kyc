<!DOCTYPE html>
<html lang="en" class="staticrypt-html">
<head>
<meta charset="utf-8" />
<title>/*[|template_title|]*/0</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="cache-control" content="max-age=0" />
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<meta http-equiv="pragma" content="no-cache" />
<!-- Password page for the KYC case-study dashboard. Styled like the deck's title slide.
     Filled by analysis/build_site_template.py, then by StatiCrypt. -->
<style>
  :root {
    --teal: #0F4C4D; --teal-2: #136062; --teal-soft: #DCEAE9; --mist: #BFD6D5;
    --ink: #1F2A2E; --muted: #5C686C; --line: #D5DCDD; --panel: #F3F6F6;
    --amber: #E0A35E; --red: #B93A2C; --white: #FFFFFF;
    --head: Georgia, "Times New Roman", serif; --body: Arial, Helvetica, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.4, .5, 1);
    --next-bg: #f6f7f8; --pin: #F08A7B;
  }
  @media (prefers-color-scheme: dark) { :root { --next-bg: #111417; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--teal); color: var(--white); font-family: var(--body); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* loading: a plain teal screen, so a remembered password opens straight into the dashboard */
  .loading { position: fixed; inset: 0; display: grid; place-items: center; }
  .loading span { width: 34px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; position: relative; }
  .loading span::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--mist); animation: bar 1s var(--ease) infinite; }
  @keyframes bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  /* the slide */
  .slide { position: relative; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: clamp(20px, 4vw, 54px) clamp(18px, 6vw, 88px) 18px; isolation: isolate; }
  .shapes { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .shape { position: absolute; border-radius: 22px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); }
  .shape.s1 { width: 46vw; height: 30vw; right: -12vw; top: -9vw; }
  .shape.s2 { width: 30vw; height: 22vw; left: -10vw; bottom: -8vw; }
  .shape.s3 { width: 14vw; height: 14vw; right: 22vw; bottom: 6vw; border-radius: 50%; }
  .kicker { color: var(--mist); font-size: clamp(13px, 1.1vw, 15px); letter-spacing: .01em; margin: 0 0 clamp(10px, 1.3vw, 18px); }
  h1 { font-family: var(--head); font-weight: normal; font-size: clamp(28px, 3.3vw, 48px); line-height: 1.15; margin: 0; max-width: 27ch; }
  .sub { color: var(--teal-soft); font-size: clamp(15px, 1.3vw, 18px); line-height: 1.5; margin: clamp(12px, 1.3vw, 18px) 0 0; max-width: 70ch; }
  .stage { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .9fr); gap: clamp(20px, 3vw, 44px); align-items: start; margin-top: clamp(20px, 2.6vw, 34px); flex: 1; }

  /* chart panel */
  .chart { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 16px 16px 10px; }
  .chart-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 6px; }
  .chart-title { font-size: 13px; color: var(--teal-soft); }
  .chart-legend { font-size: 12px; color: var(--mist); display: flex; gap: 12px; flex-wrap: wrap; }
  .chart-legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
  .chart-legend i.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pin); }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid line { stroke: rgba(255,255,255,.1); }
  .axis text { fill: var(--mist); font: 13px var(--body); }
  .line { fill: none; stroke: var(--white); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .area { fill: rgba(255,255,255,.07); }
  .split { stroke: var(--mist); stroke-dasharray: 3 4; stroke-width: 1.2; }
  .split-label { fill: var(--mist); font: 13px var(--body); }
  .avg { stroke-width: 2.5; stroke-linecap: round; }
  .avg.a { stroke: var(--teal-soft); } .avg.b { stroke: var(--amber); }
  .avg-label { font: bold 16px var(--body); paint-order: stroke; stroke: var(--teal); stroke-width: 5px; stroke-linejoin: round; }
  .avg-label.a { fill: var(--teal-soft); } .avg-label.b { fill: var(--amber); }
  .pin { fill: var(--pin); stroke: var(--teal); stroke-width: 2; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  .stat { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .stat b { display: block; font-family: var(--head); font-weight: normal; font-size: clamp(22px, 2.2vw, 30px); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { display: block; color: var(--mist); font-size: 12px; line-height: 1.4; margin-top: 6px; }

  /* password card */
  .card { background: var(--white); color: var(--ink); border-radius: 10px; padding: clamp(22px, 2.4vw, 32px); box-shadow: 0 24px 60px -24px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.12); }
  .card h2 { font-family: var(--head); font-weight: normal; color: var(--teal); font-size: clamp(22px, 1.9vw, 28px); margin: 0 0 6px; }
  .card p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
  .field { position: relative; }
  .field input { width: 100%; font: 15px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 13px 46px 13px 14px; outline: none; transition: border-color .2s, box-shadow .2s, background .2s; }
  .field input:focus { border-color: var(--teal); background: var(--white); box-shadow: 0 0 0 3px rgba(15,76,77,.15); }
  .field input[aria-invalid="true"] { border-color: var(--red); box-shadow: 0 0 0 3px rgba(185,58,44,.14); }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .eye:hover { color: var(--teal); background: rgba(15,76,77,.06); }
  .eye:focus-visible, .open:focus-visible, .remember input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .eye svg { width: 20px; height: 20px; }
  .error { color: var(--red); font-size: 13px; min-height: 20px; margin: 8px 0 4px; }
  .remember { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin: 2px 0 18px; cursor: pointer; }
  .remember input { width: 16px; height: 16px; accent-color: var(--teal); margin: 0; }
  .open { position: relative; overflow: hidden; width: 100%; font: bold 15px var(--body); letter-spacing: .02em; color: var(--white); background: var(--teal); border: 0; border-radius: 8px; padding: 14px 18px; cursor: pointer; transition: background .2s, transform .15s; }
  .open:hover { background: var(--teal-2); }
  .open:active { transform: translateY(1px); }
  .open[aria-busy="true"] { cursor: progress; }
  .open[aria-busy="true"]::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 40%; background: var(--amber); animation: bar 1s var(--ease) infinite; }
  .fine { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }
  footer { display: flex; justify-content: space-between; gap: 16px; color: var(--mist); font-size: 12px; margin-top: clamp(16px, 2vw, 28px); padding-top: 10px; border-top: 1px solid rgba(255,255,255,.12); }

  /* ---------- PowerPoint-style entrances: play only once the slide is shown ---------- */
  .play [data-anim] { animation-duration: var(--t, .7s); animation-timing-function: var(--ease); animation-delay: var(--d, 0s); animation-fill-mode: both; }
  .play [data-anim="fly-left"]  { animation-name: flyLeft; }
  .play [data-anim="wipe"]      { animation-name: wipe; --t: 1s; }
  .play [data-anim="fade-up"]   { animation-name: fadeUp; }
  .play [data-anim="fly-up"]    { animation-name: flyUp; animation-timing-function: var(--spring); }
  .play [data-anim="fly-right"] { animation-name: flyRight; animation-timing-function: var(--spring); --t: .9s; }
  .play [data-anim="zoom"]      { animation-name: zoom; animation-timing-function: var(--spring); --t: .45s; transform-box: fill-box; transform-origin: center; }
  .play [data-anim="grow-y"]    { animation-name: growY; transform-box: fill-box; transform-origin: bottom; }
  .play [data-anim="grow-x"]    { animation-name: growX; transform-box: fill-box; transform-origin: left; }
  .play [data-anim="fade"]      { animation-name: fade; }
  .play [data-anim="slide-in"]  { animation-name: slideIn; --t: 1.4s; }
  .play .shape { animation: slideIn 1.4s var(--ease) var(--d, 0s) both, drift 18s ease-in-out calc(var(--d, 0s) + 1.4s) infinite alternate; }
  .play .line { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000); animation: draw 1.8s var(--ease) var(--d, 0s) forwards; }
  @keyframes flyLeft  { from { opacity: 0; transform: translateX(-70px); } to { opacity: 1; transform: none; } }
  @keyframes wipe     { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes flyUp    { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
  @keyframes flyRight { from { opacity: 0; transform: translateX(110%); } to { opacity: 1; transform: none; } }
  @keyframes zoom     { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes growY    { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes growX    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fade     { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideIn  { from { opacity: 0; transform: translate(var(--fx, 0), var(--fy, 0)); } to { opacity: 1; transform: none; } }
  @keyframes drift    { from { transform: none; } to { transform: translate(var(--dx, 2vw), var(--dy, 1vw)) rotate(var(--dr, 2deg)); } }
  @keyframes draw     { to { stroke-dashoffset: 0; } }
  @keyframes shake    { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-8px); } 40%, 60% { transform: translateX(8px); } }
  .card.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97) both !important; }

  /* exit: a "push" transition into the dashboard */
  .curtain { position: fixed; inset: 0; z-index: 10; background: var(--next-bg); transform: translateX(100%); pointer-events: none; }
  .leaving .slide { transition: transform .55s var(--ease), opacity .55s var(--ease); transform: translateX(-12%); opacity: 0; }
  .leaving .curtain { transition: transform .55s var(--ease); transform: none; }

  @media (max-width: 900px) {
    .stage { grid-template-columns: minmax(0, 1fr); }
    .card { order: -1; }
    h1 { max-width: none; }
  }
  @media (max-width: 520px) {
    .stats { grid-template-columns: minmax(0, 1fr); }
    .stat { display: flex; align-items: baseline; gap: 12px; }
    .stat span { margin-top: 0; }
    footer { flex-direction: column; gap: 4px; }
    .chart-head { flex-direction: column; }
    .axis text, .split-label { font-size: 22px; }
    .avg-label { font-size: 26px; stroke-width: 7px; }
    .pin { r: 7; }
  }
  @media (prefers-reduced-motion: reduce) {
    .play [data-anim], .play .shape, .play .line, .card.shake { animation: none !important; }
    .play .line { stroke-dasharray: none; stroke-dashoffset: 0; }
    .leaving .slide, .leaving .curtain { transition: none; }
  }
</style>
</head>
<body class="staticrypt-body">
<div id="staticrypt_loading" class="loading" aria-label="Loading"><span></span></div>
<noscript><p style="padding:24px;font-family:Arial,sans-serif">This page needs JavaScript to decrypt the dashboard.</p></noscript>

<div id="staticrypt_content" class="hidden">
  <div class="shapes" aria-hidden="true">
    <div class="shape s1" style="--d:.1s; --fx:30vw; --fy:-6vw; --dx:-3vw; --dy:2vw; --dr:-3deg"></div>
    <div class="shape s2" style="--d:.25s; --fx:-24vw; --fy:8vw; --dx:3vw; --dy:-1.5vw; --dr:2deg"></div>
    <div class="shape s3" style="--d:.4s; --fx:0; --fy:22vw; --dx:-2vw; --dy:-2vw; --dr:0deg"></div>
  </div>

  <main class="slide">
    <p class="kicker" data-anim="fly-left" style="--d:.15s">{{ kicker }}</p>
    <h1 data-anim="wipe" style="--d:.35s">{{ headline }}</h1>
    <p class="sub" data-anim="fade-up" style="--d:1.05s">{{ subtitle }}</p>

    <div class="stage">
      <section aria-label="Approval rate by day">
        <div class="chart" data-anim="fade-up" style="--d:1.3s">
          <div class="chart-head">
            <span class="chart-title">{{ chart_title }}</span>
            <span class="chart-legend"><span><i style="background:var(--teal-soft)"></i>Prior 30 days</span><span><i style="background:var(--amber)"></i>Recent 30 days</span><span><i class="dot"></i>Incident window day</span></span>
          </div>
          {{ chart_svg }}
        </div>
        <div class="stats">
          {{ stats }}
        </div>
      </section>

      <section class="card" id="card" data-anim="fly-right" style="--d:.7s" aria-labelledby="card-title">
        <h2 id="card-title">Open the dashboard</h2>
        <p>/*[|template_instructions|]*/0</p>
        <form id="staticrypt-form" action="#" method="post" novalidate>
          <label class="sr" for="staticrypt-password">/*[|template_placeholder|]*/0</label>
          <div class="field">
            <input id="staticrypt-password" type="password" name="password" placeholder="/*[|template_placeholder|]*/0" autocomplete="current-password" aria-describedby="staticrypt-error" required />
            <button type="button" class="eye" id="toggle" aria-label="/*[|template_toggle_show|]*/0" title="/*[|template_toggle_show|]*/0">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
                <path class="slash" d="M3 3l18 18"/>
              </svg>
            </button>
          </div>
          <div class="error" id="staticrypt-error" role="alert" aria-live="assertive"></div>
          <label id="staticrypt-remember-label" class="remember hidden">
            <input id="staticrypt-remember" type="checkbox" name="remember" />
            /*[|template_remember|]*/0
          </label>
          <button type="submit" class="open" id="open">/*[|template_button|]*/0</button>
        </form>
        <p class="fine">{{ fineprint }}</p>
      </section>
    </div>

    <footer data-anim="fade" style="--d:2.4s">
      <span>{{ footer }}</span>
      <span>{{ footer_right }}</span>
    </footer>
  </main>
  <div class="curtain" aria-hidden="true"></div>
</div>

<script>
  // filled by StatiCrypt at encryption time; the template format is '/*[|variable_name|]*/0'
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const templateError = "/*[|template_error|]*/0",
    templateToggleAltShow = "/*[|template_toggle_show|]*/0",
    templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
    isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
    staticryptConfig = /*[|staticrypt_config|]*/ 0;

  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let playExit = false;

  // write the decrypted dashboard; after a typed password, play the push transition first
  function replaceHtml(plainHTML) {
    const write = () => { document.open(); document.write(plainHTML); document.close(); };
    if (!playExit || reduceMotion) { write(); return; }
    document.body.classList.add("leaving");
    setTimeout(write, 560);
  }

  const templateConfig = {
    rememberExpirationKey: "staticrypt_expiration",
    rememberPassphraseKey: "staticrypt_passphrase",
    replaceHtmlCallback: replaceHtml,
    clearLocalStorageCallback: null,
  };
  const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

  const $ = (id) => document.getElementById(id);
  const input = $("staticrypt-password"), card = $("card"), err = $("staticrypt-error"), open = $("open");

  // count the headline figures up as their cards fly in
  function countUp(elm) {
    const to = Number(elm.dataset.to), dec = Number(elm.dataset.dec || 0), pre = elm.dataset.pre || "", suf = elm.dataset.suf || "";
    const fmt = (v) => pre + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;
    if (reduceMotion) { elm.textContent = fmt(to); return; }
    const delay = parseFloat(getComputedStyle(elm.closest(".stat")).getPropertyValue("--d")) * 1000 || 0, dur = 1100;
    elm.textContent = fmt(0);
    setTimeout(() => {
      const t0 = performance.now();
      const step = (now) => { const k = Math.min(1, (now - t0) / dur); elm.textContent = fmt(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }, delay);
  }

  function showSlide() {
    $("staticrypt_loading").classList.add("hidden");
    $("staticrypt_content").classList.remove("hidden");
    if (isRememberEnabled) $("staticrypt-remember-label").classList.remove("hidden");
    const line = document.querySelector(".line");
    if (line && line.getTotalLength) {
      line.style.setProperty("--len", Math.ceil(line.getTotalLength()));
      // once drawn, drop the dash pattern so the line can never be left hidden
      const settle = () => { line.style.animation = "none"; line.style.strokeDasharray = "none"; line.style.strokeDashoffset = "0"; };
      line.addEventListener("animationend", settle, { once: true });
      setTimeout(settle, 4200);
    }
    document.querySelectorAll("[data-to]").forEach(countUp);
    requestAnimationFrame(() => document.body.classList.add("play"));
    // focus the field on larger screens only: on phones it would open the keyboard over the title
    if (window.matchMedia("(min-width: 901px)").matches) setTimeout(() => input.focus({ preventScroll: true }), reduceMotion ? 0 : 900);
  }

  window.onload = async function () {
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    if (!isSuccessful) showSlide();
  };

  $("toggle").addEventListener("click", function () {
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    this.classList.toggle("on", show);
    this.querySelector(".slash").style.display = show ? "none" : "";
    const label = show ? templateToggleAltHide : templateToggleAltShow;
    this.setAttribute("aria-label", label); this.title = label;
    input.focus();
  });
  document.querySelector(".slash").style.display = "";

  input.addEventListener("input", () => { if (err.textContent) { err.textContent = ""; input.removeAttribute("aria-invalid"); } });

  $("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!input.value) { input.focus(); return; }
    open.setAttribute("aria-busy", "true"); open.disabled = true;
    playExit = true;
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, $("staticrypt-remember").checked);
    if (isSuccessful) return;
    playExit = false;
    open.removeAttribute("aria-busy"); open.disabled = false;
    err.textContent = templateError;
    input.setAttribute("aria-invalid", "true");
    input.select();
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  });
</script>
</body>
</html>
