<!DOCTYPE html>
<html lang="en" class="staticrypt-html">
<head>
<meta charset="utf-8" />
<title>/*[|template_title|]*/0</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="cache-control" content="max-age=0" />
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<meta http-equiv="pragma" content="no-cache" />
<!-- Password page for the KYC case-study dashboard. Same theme tokens as the dashboard
     (filled from export_html.py by build_site_template.py), with three touches from
     ARQ's own site: the lime announcement strip, square solid buttons, tight headline tracking. -->
<style>
{{ theme_css }}
  :root { --arq-lime: #f0ff9c; --arq-ink: #000; --btn-bg: #000; --btn-fg: #fff; --btn-hover: #2b2b2b; }
  @media (prefers-color-scheme: dark) { :root { --btn-bg: #fff; --btn-fg: #000; --btn-hover: #e7e5e4; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }

  .strip { background: var(--arq-lime); color: var(--arq-ink); font-size: 13px; letter-spacing: -0.01em; padding: 9px 16px; text-align: center; }
  .page { max-width: 80rem; margin: 0 auto; padding: var(--cds-gap-xl) clamp(16px, 4vw, 40px); display: flex; flex-direction: column; gap: var(--cds-gap-lg); }
  .head { display: flex; flex-direction: column; gap: var(--cds-gap-sm); }
  h1 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: clamp(26px, 3vw, 34px); line-height: 1.15; letter-spacing: -0.02em; margin: 0; }
  .lede { margin: 0; font-size: 16px; max-width: 70ch; }
  .lede b { font-variant-numeric: tabular-nums; }
  .scope { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }

  .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: var(--cds-gap-md); align-items: stretch; }
  .grid > .tiles { grid-column: 1 / -1; }
  .card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); display: flex; flex-direction: column; gap: var(--cds-gap-sm); min-width: 0; }
  .card h2 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 0; }
  .note { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); margin: 0; line-height: 1.45; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid-line { stroke: var(--cds-chart-grid); }
  .axis { fill: var(--color-fg-muted); font: 11px var(--font-anthropic-sans); }
  .inc { fill: var(--cds-chart-status-critical); fill-opacity: 0.14; }
  .avg { stroke: var(--cds-chart-reference); stroke-dasharray: 4 3; stroke-width: 1.2; }
  .avg-label { fill: var(--color-fg-muted); font: 11px var(--font-anthropic-sans); }
  .line { fill: none; stroke: var(--kx-s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .legend i.box { height: 10px; width: 10px; border-radius: 2px; }

  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--cds-gap-md); }
  .tile { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md) var(--cds-pad-lg); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tile .label { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .tile .big { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .sub { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.4; }

  .lock .fine { margin-top: auto; }
  .field { position: relative; margin-top: var(--cds-gap-xs); }
  .field input { width: 100%; font: inherit; font-size: 15px; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: 0; padding: 12px 46px 12px 12px; outline: none; transition: border-color .15s; }
  .field input:focus { border-color: var(--color-fg); }
  .field input[aria-invalid="true"] { border-color: var(--color-bad); }
  .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: transparent; color: var(--color-fg-muted); cursor: pointer; display: grid; place-items: center; }
  .eye:hover { color: var(--color-fg); }
  .eye svg { width: 20px; height: 20px; }
  .eye:focus-visible, .open:focus-visible, .remember input:focus-visible { outline: 2px solid var(--color-fg-muted); outline-offset: 2px; }
  .error { color: var(--color-bad); font-size: var(--cds-font-size-caption); min-height: 18px; margin: 0; }
  .remember { display: flex; align-items: center; gap: 8px; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); cursor: pointer; }
  .remember input { width: 15px; height: 15px; margin: 0; accent-color: var(--color-fg); }
  .open { width: 100%; font: inherit; font-size: 16px; letter-spacing: -0.01em; color: var(--btn-fg); background: var(--btn-bg); border: 0; border-radius: 0; padding: 13px 24px; cursor: pointer; margin-top: var(--cds-gap-xs); transition: background .15s; }
  .open:hover { background: var(--btn-hover); }
  .open[aria-busy="true"] { cursor: progress; opacity: .7; }
  .fine { border-top: 1px solid var(--color-border-line); padding-top: var(--cds-gap-sm); margin-top: var(--cds-gap-xs); }

  footer { border-top: 1px solid var(--color-border-line); padding-top: var(--cds-pad-md); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; }

  /* motion: one fade on reveal, one line draw, a shake on a wrong password, a fade out */
  .play .page { animation: rise .35s var(--cds-ease-out) both; }
  .play .line { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000); animation: draw .9s var(--cds-ease-out) .25s forwards; }
  .card.shake { animation: shake .32s ease-in-out; }
  .leaving .page, .leaving .strip { transition: opacity .2s ease-out; opacity: 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  @media (prefers-reduced-motion: reduce) {
    .play .page, .play .line, .card.shake { animation: none; }
    .play .line { stroke-dasharray: none; stroke-dashoffset: 0; }
    .leaving .page, .leaving .strip { transition: none; }
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .lock { order: -1; }
  }
  @media (max-width: 520px) {
    .tiles { grid-template-columns: minmax(0, 1fr); }
    .axis, .avg-label { font-size: 18px; }
  }
</style>
</head>
<body class="staticrypt-body">
<div id="staticrypt_loading" class="loading">Please wait…</div>
<noscript><p style="padding:24px">This page needs JavaScript to open the dashboard.</p></noscript>

<div id="staticrypt_content" class="hidden">
  <div class="strip">{{ strip }}</div>
  <main class="page">
    <header class="head">
      <h1>{{ headline }}</h1>
      <p class="lede">{{ lede }}</p>
      <p class="scope">{{ scope }}</p>
    </header>

    <div class="grid">
      <section class="card" aria-label="Approval among recorded decisions, by day">
          <h2>{{ chart_title }}</h2>
          {{ chart_svg }}
          <div class="legend">
            <span><i style="background:var(--kx-s1)"></i>Daily pass rate</span>
            <span><i style="background:var(--cds-chart-reference)"></i>Period average</span>
            <span><i class="box" style="background:var(--cds-chart-status-critical);opacity:.35"></i>Incident window day</span>
          </div>
      </section>

      <section class="card lock" id="card" aria-labelledby="card-title">
        <h2 id="card-title">Open the dashboard</h2>
        <p class="note">/*[|template_instructions|]*/0</p>
        <form id="staticrypt-form" action="#" method="post" novalidate>
          <label class="sr" for="staticrypt-password">/*[|template_placeholder|]*/0</label>
          <div class="field">
            <input id="staticrypt-password" type="password" name="password" placeholder="/*[|template_placeholder|]*/0" autocomplete="current-password" aria-describedby="staticrypt-error" required />
            <button type="button" class="eye" id="toggle" aria-label="/*[|template_toggle_show|]*/0" title="/*[|template_toggle_show|]*/0">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M3 3l18 18"/>
              </svg>
            </button>
          </div>
          <p class="error" id="staticrypt-error" role="alert" aria-live="assertive"></p>
          <label id="staticrypt-remember-label" class="remember hidden">
            <input id="staticrypt-remember" type="checkbox" name="remember" />
            /*[|template_remember|]*/0
          </label>
          <button type="submit" class="open" id="open">/*[|template_button|]*/0</button>
        </form>
        <p class="note fine">{{ fineprint }}</p>
      </section>

      <div class="tiles">
        {{ stats }}
      </div>
    </div>

    <footer>
      <span>{{ footer }}</span>
      <span>{{ footer_right }}</span>
    </footer>
  </main>
</div>

<script>
  // filled by StatiCrypt at encryption time; the template format is '/*[|variable_name|]*/0'
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const templateError = "/*[|template_error|]*/0",
    templateToggleAltShow = "/*[|template_toggle_show|]*/0",
    templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
    isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
    staticryptConfig = /*[|staticrypt_config|]*/ 0;

  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let fadeOut = false;
  function replaceHtml(plainHTML) {
    const write = () => { document.open(); document.write(plainHTML); document.close(); };
    if (!fadeOut || reduceMotion) { write(); return; }
    document.body.classList.add("leaving");
    setTimeout(write, 200);
  }
  const staticrypt = staticryptInitiator.init(staticryptConfig, {
    rememberExpirationKey: "staticrypt_expiration",
    rememberPassphraseKey: "staticrypt_passphrase",
    replaceHtmlCallback: replaceHtml,
    clearLocalStorageCallback: null,
  });

  const $ = (id) => document.getElementById(id);
  const input = $("staticrypt-password"), card = $("card"), err = $("staticrypt-error"), open = $("open");

  function showPage() {
    $("staticrypt_loading").classList.add("hidden");
    $("staticrypt_content").classList.remove("hidden");
    if (isRememberEnabled) $("staticrypt-remember-label").classList.remove("hidden");
    const line = document.querySelector(".line");
    if (line && line.getTotalLength) {
      line.style.setProperty("--len", Math.ceil(line.getTotalLength()));
      const settle = () => { line.style.animation = "none"; line.style.strokeDasharray = "none"; line.style.strokeDashoffset = "0"; };
      line.addEventListener("animationend", settle, { once: true });
      setTimeout(settle, 1500);
    }
    requestAnimationFrame(() => document.body.classList.add("play"));
    // on phones a focused field opens the keyboard over the page, so focus only on larger screens
    if (window.matchMedia("(min-width: 861px)").matches) input.focus({ preventScroll: true });
  }

  window.onload = async function () {
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    if (!isSuccessful) showPage();
  };

  $("toggle").addEventListener("click", function () {
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    this.querySelector(".slash").style.display = show ? "none" : "";
    const label = show ? templateToggleAltHide : templateToggleAltShow;
    this.setAttribute("aria-label", label); this.title = label;
    input.focus();
  });
  input.addEventListener("input", () => { if (err.textContent) { err.textContent = ""; input.removeAttribute("aria-invalid"); } });

  $("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!input.value) { input.focus(); return; }
    open.setAttribute("aria-busy", "true"); open.disabled = true;
    fadeOut = true;
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, $("staticrypt-remember").checked);
    if (isSuccessful) return;
    fadeOut = false;
    open.removeAttribute("aria-busy"); open.disabled = false;
    err.textContent = templateError;
    input.setAttribute("aria-invalid", "true");
    input.select();
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  });
</script>
</body>
</html>
